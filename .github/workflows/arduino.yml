name: Build and Release

on:
  pull_request:
  push:
    branches:
      - master
      - dev
    tags:
      - "v*"

permissions:
  contents: read

env:
  ARDUINO_ESP32_VERSION: 3.3.11
  FQBN: esp32:esp32:m5stack_atom

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run native tests
        run: make -C tests runtests

  build:
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
          arduino-cli core install --additional-urls "https://espressif.github.io/arduino-esp32/package_esp32_index.json" "esp32:esp32@${ARDUINO_ESP32_VERSION}"

      - name: Install libraries
        run: |
          arduino-cli lib install "M5Unified"@0.2.19
          arduino-cli lib install "FastLED"@3.10.5
          arduino-cli lib install "ArduinoQueue"@1.2.5
          arduino-cli lib install "ArduinoLog"@1.1.1

      - name: Compile ATOM Lite firmware
        run: |
          arduino-cli compile \
            --fqbn "${FQBN}" \
            --build-path build/atomlite \
            --build-property "compiler.cpp.extra_flags=-DBB_LINK_ALLOW_UNSIGNED_OTA_WITH_PHYSICAL_ACCESS=1" \
            --warnings all \
            src/bb-link

      - name: Prepare Web Flasher
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: ./scripts/prepare_web_flasher.sh build/atomlite build/web-flasher

      - name: Upload Web Flasher
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: web-flasher
          path: build/web-flasher
          include-hidden-files: true
          if-no-files-found: error

      - name: Prepare release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BINARY="bb-link-atomlite-${VERSION}.bin"
          FACTORY_BINARY="bb-link-atomlite-${VERSION}-factory.bin"
          cp build/atomlite/bb-link.ino.bin "build/atomlite/${BINARY}"
          cp build/atomlite/bb-link.ino.merged.bin "build/atomlite/${FACTORY_BINARY}"
          sha256sum "build/atomlite/${BINARY}" | cut -d ' ' -f 1 > "build/atomlite/${BINARY}.sha256.txt"
          sha256sum "build/atomlite/${FACTORY_BINARY}" | cut -d ' ' -f 1 > "build/atomlite/${FACTORY_BINARY}.sha256.txt"
          mkdir -p build/ota/atomlite
          SHA256="$(cat "build/atomlite/${BINARY}.sha256.txt")"
          printf '{\n  "version": "%s",\n  "url": "https://github.com/%s/releases/download/v%s/%s",\n  "sha256": "%s"\n}\n' \
            "${VERSION}" "${GITHUB_REPOSITORY}" "${VERSION}" "${BINARY}" "${SHA256}" \
            > build/ota/atomlite/beta.json

      - name: Upload firmware
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: firmware-atomlite
          path: |
            build/atomlite/bb-link-atomlite-*.bin
            build/atomlite/bb-link-atomlite-*.sha256.txt
          if-no-files-found: error

      - name: Upload OTA manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ota-atomlite
          path: build/ota/atomlite/beta.json
          if-no-files-found: error

  deploy-web-flasher:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download Web Flasher
        uses: actions/download-artifact@v4
        with:
          name: web-flasher
          path: web-flasher

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-flasher

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-atomlite
          path: artifacts

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --prerelease \
            --title "Release ${GITHUB_REF_NAME}"

  publish-ota:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download OTA manifest
        uses: actions/download-artifact@v4
        with:
          name: ota-atomlite
          path: ${{ runner.temp }}/ota-artifacts/atomlite

      - name: Publish beta manifest
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          if git ls-remote --exit-code --heads origin ota-firmware; then
            git fetch origin ota-firmware
            git switch --force-create ota-firmware origin/ota-firmware
          else
            git switch --orphan ota-firmware
            git rm -r --force .
          fi
          mkdir -p atomlite
          cp "${RUNNER_TEMP}/ota-artifacts/atomlite/beta.json" atomlite/beta.json
          git add atomlite/beta.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish ${GITHUB_REF_NAME} beta firmware"
          git push origin HEAD:ota-firmware
